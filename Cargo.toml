[package]
name = "machine_setup"
version = "2.10.0"
edition = "2021"
description = "A CLI tool with TUI for automating machine configuration and setup tasks"
license = "MIT OR Apache-2.0"
authors = ["Timo Pruesse"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Async runtime (trimmed — avoid `full` for faster sync-verb startup / smaller binary)
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "io-util",
    "signal",
] }

# TUI
ratatui = "0.30"
crossterm = "0.29"

# Config parsing
serde = { version = "1", features = ["derive", "rc"] }
serde_yaml = "0.9"
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
walkdir = "2"
dialoguer = "0.12"
async-trait = "0.1"
tokio-util = "0.7"
indexmap = { version = "2", features = ["serde"] }
ureq = "3"
rayon = "1"
libc = "0.2"

# Host-gated: build.rs only embeds the Windows application manifest when
# compiling on Windows (CI uses windows-latest, not cross-compile).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }

[[bench]]
name = "command_bench"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
future_incompatible = "warn"
nonstandard_style = "warn"

# Published crate/binary name is snake_case (`machine_setup`); renaming would
# break `cargo install` and existing scripts. Keep the historical name.
[lints.cargo]
non_kebab_case_bins = "allow"

[lints.clippy]
# Handbook-priority lints (Apollo Ch. 2). Default clippy groups stay at
# their usual levels; CI/`make lint` still treat warnings as errors.
redundant_clone = "deny"
needless_collect = "deny"
clone_on_copy = "deny"
large_enum_variant = "warn"
# Lock the production unwrap/expect baseline (unit-test modules are
# cfg(test) and not compiled by `make lint`'s default clippy targets).
unwrap_used = "deny"
expect_used = "deny"

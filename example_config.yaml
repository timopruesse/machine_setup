# Example machine_setup v2 configuration
# Demonstrates command types, OS filters, and a slower run so the TUI
# elapsed-time / spinner polish is easy to see (`make run`).

temp_dir: "~/.machine_setup"
default_shell: "bash"
# Run independent tasks concurrently so several rows stay "running".
parallel: true

tasks:
  greet:
    commands:
      - run:
          commands:
            - "echo 'Hello from machine_setup v2!'"
            - "sleep 2"
            - "echo 'Greeting done.'"

  multi_step:
    commands:
      - run:
          commands:
            - "echo 'Step 1: Checking environment...'"
            - "sleep 3"
            - "echo 'Step 2: Configuring settings...'"
            - "sleep 3"
            - "echo 'Step 3: All done!'"

  slow_work:
    commands:
      - run:
          commands:
            - "echo 'Starting slow work (about 10s)...'"
            - "sleep 10"
            - "echo 'Slow work finished.'"

  medium_work:
    commands:
      - run:
          commands:
            - "echo 'Medium task (about 7s)...'"
            - "sleep 7"
            - "echo 'Medium task finished.'"

  with_env_vars:
    commands:
      - run:
          env:
            MY_NAME: "machine_setup"
            VERSION: "2.0"
          commands:
            - "echo \"Running $MY_NAME v$VERSION\""
            - "sleep 2"

  mode_specific:
    commands:
      - run:
          install:
            - "echo 'Installing components...'"
            - "sleep 4"
            - "echo 'Install complete.'"
          update:
            - "echo 'Updating components...'"
            - "sleep 4"
            - "echo 'Update complete.'"
          uninstall:
            - "echo 'Removing components...'"
            - "sleep 2"
            - "echo 'Uninstall complete.'"

  windows_task:
    os: "windows"
    commands:
      - run:
          commands:
            - "echo 'This runs only on Windows'"
            - "powershell -Command \"Start-Sleep -Seconds 3\""

  linux_task:
    os: "linux"
    commands:
      - run:
          commands:
            - "echo 'This runs only on Linux'"
            - "sleep 3"

  macos_task:
    os: "macos"
    commands:
      - run:
          commands:
            - "echo 'This runs only on macOS'"
            - "sleep 3"

  cross_platform:
    os: ["linux", "macos", "windows"]
    commands:
      - run:
          commands:
            - "echo 'This runs on all desktop platforms'"
            - "sleep 2"

  # Different sleeps so parallel rows finish at staggered times.
  parallel_commands:
    parallel: true
    commands:
      - run:
          commands:
            - "echo 'Command A starting (8s)'"
            - "sleep 8"
            - "echo 'Command A done'"
      - run:
          commands:
            - "echo 'Command B starting (10s)'"
            - "sleep 10"
            - "echo 'Command B done'"
      - run:
          commands:
            - "echo 'Command C starting (5s)'"
            - "sleep 5"
            - "echo 'Command C done'"

  unified_cross_platform:
    commands:
      - run:
          os: "linux"
          commands: "echo 'Linux-specific command executed'"
      - run:
          os: "macos"
          commands: "echo 'macOS-specific command executed'"
      - run:
          os: "windows"
          commands: "echo 'Windows-specific command executed'"
      - run:
          commands: "echo 'Common command for all platforms'"
